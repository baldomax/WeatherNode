name: Security Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit (critical only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Audit PHP dependencies (critical advisories only)
        run: |
          composer audit --locked --no-interaction --format=json > composer-audit.json || true
          php -r '
          $report = json_decode(file_get_contents("composer-audit.json"), true) ?: [];
          $advisoriesByPackage = $report["advisories"] ?? [];
          $critical = [];
          foreach ($advisoriesByPackage as $package => $advisories) {
              foreach ((array)$advisories as $advisory) {
                  $severity = strtolower((string)($advisory["severity"] ?? ""));
                  $cvss = $advisory["cvss_score"] ?? $advisory["cvss"] ?? null;
                  $cvssValue = is_numeric($cvss) ? (float)$cvss : null;
                  if ($severity === "critical" || ($cvssValue !== null && $cvssValue >= 9.0)) {
                      $critical[] = [
                          "package" => $package,
                          "id" => (string)($advisory["advisoryId"] ?? $advisory["id"] ?? "unknown"),
                          "severity" => $severity !== "" ? $severity : "unknown",
                          "cvss" => $cvssValue,
                          "title" => (string)($advisory["title"] ?? "Untitled advisory"),
                      ];
                  }
              }
          }
          if (count($critical) > 0) {
              fwrite(STDERR, "Critical Composer advisories found:\n");
              foreach ($critical as $item) {
                  $cvssText = $item["cvss"] !== null ? " (CVSS " . $item["cvss"] . ")" : "";
                  fwrite(STDERR, "- {$item["package"]} {$item["id"]}: {$item["title"]} [{$item["severity"]}]{$cvssText}\n");
              }
              exit(1);
          }
          echo "No critical Composer advisories found.\n";
          '

      - name: Audit npm production dependencies (critical only)
        run: npm audit --omit=dev --audit-level=critical

  container-scan:
    name: Container Scan (critical only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: weathernode:security-scan

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: weathernode:security-scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
